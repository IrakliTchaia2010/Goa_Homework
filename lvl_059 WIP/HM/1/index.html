<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | NFT preview card component</title>
</head>
<body>
  <div id="card">
    <img id="cardimg" src="images/image-equilibrium.jpg">
    <h1>Equilibrium #3429</h1>
    <p id="p1">Our Equilibrium collection promotes balance and calm.</p>
    <div id="info">
      <div id="infos1">
        <img id="icon1" src="images/icon-ethereum.svg">
        <h2>0.041 ETH</h2>
      </div>
      <div id="infos2">
        <img id="icon2" src="images/icon-clock.svg">
        <p id="p2">3 days left</p>
      </div>
    </div>
    <div id="line"></div>
    <div id="profile">
      <img id="pfp" src="images/image-avatar.png">
      <p id="p3">Creation of</p>
      <p id="p4">Jules Wyvern</p>
    </div>
  </div>
</body>
</html>

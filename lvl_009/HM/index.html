<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 2
    <b></b> - გამუქებული ტექსტი (bold)
    <i></i> - გადახრილი ტექსტი (italics)
    <u></u> - გახაზული ტექსტი (underline)
    <strong></strong> - მნიშვნელოვანი ტექსტი, ჩანს როგორც <b>
    <em></em> - მნიშვნელოვანი ტექსტი, ჩანს როგორც <i> (emphasis) -->

    <!-- 3
    ვიზუალურად იგივედ ჩანს
    მარგო განსხვავება არის რომ <strong> და <em> არის მნიშვნელოვანი თაგები
    წარმოიდგინე ისეთი მნიშვნელობა არიან როგორც გამაფრთხილებელი ტექსტი -->

    <!-- 4 -->
    <h1>Myself!</h1>
    <img src="qno9kdg1qy6g1.jpeg" alt="me?" height="100px" weight="100px">
    <p>I'm <i>just</i> a kid. What else <strong><em>can</em></strong> I tell you?</p>

    <h1>Car!</h1>
    <p>I don't have a favorite car :/</p>
    <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ"><button>But here's a button to buy a car!</button></a>

    <h1>Anything!</h1>
    <p><i>Remember to eat water and drink food.</i></p>
    <h2>Why though?</h2>
    <p>I don't know.</p>

    <!-- 5
    <a></a> - დალინკვის კოდი
    აქვს href ნაწილი, რომელშიც url-ს ლინკი შეგიძლია რომ ჩააგდო რომ მერე გადაგიყვანოს რომელიმე ვებსაიტისკენ -->

    <!-- 6
    hyperText - პირდაპირი ვებსაიტის გადაყვანაზე
    hyperLink - სხვა ტაბის შექმნა რომ ვებსაიტზე გადაგიყვანოს -->
</body>
</html>

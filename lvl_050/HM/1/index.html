<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Social links profile</title>
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <div id="profile">
    <div id="profilepart">
      <img src="assets/images/avatar-jessica.jpeg" alt="pfp" id="pfp">
      <div id="maininfo">
        <p id="name"><b>Jessica Randall</b></p>
        <p id="location"><b>London, United Kingdom</b></p>
      </div>
      <p id="job">"Front-end developer and avid reader."</p>
    </div>
    <div id="buttonpart">
      <button class="buttons"><b>GitHub</b></button>
      <button class="buttons"><b>Frontend Mentor</b></button>
      <button class="buttons"><b>Linkedln</b></button>
      <button class="buttons"><b>Twitter</b></button>
      <button class="buttons"><b>Instagram</b></button>
    </div>
  </div>

</body>
</html>

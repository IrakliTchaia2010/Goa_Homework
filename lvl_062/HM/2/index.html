<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Results summary component</title>
</head>
<body>
  <div id="main">
    <div id="leftside">
      <h2 id="resulttext1">Your Result</h2>
      <div id="circle">
        <h1 id="score1">76</h1>
        <p id="score2">of 100</p>
      </div>
      <h1 id="resulttext2">Great</h1>
      <p id="resulttext3">You scored higher than 65% of the people who have taken these tests.</p>
    </div>
    <div id="rightside">
      <h1 id="summarytext">Summary</h1>
      <div id="slots">
        <div id="slot1">
          <img src="assets/images/icon-reaction.svg">
          Reaction
          <p id="scored1"><b>80</b> / 100</p>
        </div>
        <div id="slot2">
          <img src="assets/images/icon-memory.svg">
          Memory
          <p id="scored2"><b>92</b> / 100</p>
        </div>
        <div id="slot3">
          <img src="assets/images/icon-verbal.svg">
          Verbal
          <p id="scored3"><b>61</b> / 100</p>
        </div>
        <div id="slot4">
          <img src="assets/images/icon-visual.svg">
          Visual
          <p id="scored4"><b>72</b> / 100</p>
        </div>
      </div>
      <button>Continue</button>
    </div>
  </div>
</body>
</html>
